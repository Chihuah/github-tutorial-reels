<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Git 基本操作流程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
:root{
  --bg:#09090b; --panel:#111114; --panel2:#0c0c0f; --line:#26262c;
  --fg:#e7e5e4; --dim:#8b8b94; --dimmer:#55555d;
  --blue:#3b82f6; --orange:#f59e0b; --green:#22c55e; --purple:#a78bfa;
  --red:#f87171; --cyan:#67e8f9; --yellow:#facc15;
  --sans:"Inter","Noto Sans TC","WenQuanYi Zen Hei",sans-serif;
  --mono:"JetBrains Mono","DejaVu Sans Mono","Noto Sans TC","WenQuanYi Zen Hei Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:var(--sans);color:var(--fg);position:relative;
  background:radial-gradient(1200px 900px at 50% 30%, #12151f 0%, var(--bg) 70%)}

/* brand */
.brand{position:absolute;top:44px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px}
.brand .logo{width:52px;height:52px;border-radius:12px;background:#2563eb;display:grid;place-items:center}
.brand span{font:600 30px/1 "Inter",sans-serif;color:#d4d4d8;letter-spacing:.2px}

.kicker{position:absolute;top:130px;left:0;right:0;text-align:center;font:500 28px/1 var(--sans);color:#60a5fa;letter-spacing:1px}
.title{position:absolute;top:176px;left:0;right:0;text-align:center;font:900 66px/1.1 var(--sans);color:#fafafa;letter-spacing:1px}

/* terminal */
.term{position:absolute;top:290px;left:28px;width:1024px;height:360px;background:#050506;border:1.5px solid #2a2a31;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.term .bar{height:44px;background:#141418;border-bottom:1px solid #222228;display:flex;align-items:center;padding:0 18px;gap:10px;position:relative}
.term .bar i{width:14px;height:14px;border-radius:50%;display:block}
.term .bar b{position:absolute;left:0;right:0;text-align:center;font:400 19px/44px var(--mono);color:#77777f}
.term .body{position:absolute;top:44px;left:0;right:0;bottom:0;padding:16px 22px;font:400 22px/30px var(--mono);white-space:pre;color:#d4d4d8}
.term .ln{height:30px}
.term .ps{color:#4ade80}
.term .cur{display:inline-block;width:12px;height:25px;background:#e4e4e7;vertical-align:-5px;margin-left:1px}
.c-red{color:var(--red)} .c-green{color:#4ade80} .c-dim{color:#7c7c86} .c-cyan{color:var(--cyan)} .c-yellow{color:var(--yellow)} .c-hd{color:#38bdf8}

/* cards */
.cards{position:absolute;top:676px;left:28px;width:1024px}
.card{position:absolute;left:0;width:1024px;height:172px;border-radius:22px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.card .glow{position:absolute;inset:0;opacity:0;pointer-events:none}
.card .ic{position:absolute;left:26px;top:43px;width:86px;height:86px;border-radius:24px;display:grid;place-items:center;background:#1a1a1f;border:2px solid #2c2c33}
.card .ic svg{width:44px;height:44px}
.card .tx{position:absolute;left:136px;top:30px}
.card .zh{font:700 36px/1.1 var(--sans);color:#d4d4d8}
.card .en{font:500 21px/1.2 "Inter",sans-serif;color:var(--dim);margin-top:8px}
.card .cmd{display:inline-block;margin-top:12px;font:600 19px/1 var(--mono);color:#a1a1aa;background:#1b1b20;border:1px solid #2c2c33;border-radius:8px;padding:6px 10px}

/* WD code + mini calc */
.code{position:absolute;left:440px;top:18px;width:420px;height:132px;background:var(--panel2);border:1px solid #24242a;border-radius:12px;padding:10px 14px;font:400 19px/26px var(--mono);overflow:hidden}
.code .fh{display:flex;justify-content:space-between;color:#a1a1aa;font-size:17px;border-bottom:1px solid #222;margin-bottom:6px;padding-bottom:2px}
.code .badge{color:var(--orange);font-weight:600}
.code .row{position:relative;height:26px}
.code .row span{white-space:pre}
.code .row > span{position:absolute;left:0;top:0}
.minicalc{position:absolute;left:878px;top:18px;width:120px;height:132px;background:#fff;border-radius:10px;padding:7px}
.minicalc .disp{height:20px;background:#222;border-radius:3px;margin-bottom:5px;color:#fff;font:600 13px/20px "Inter";text-align:right;padding-right:5px}
.minicalc .g{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:16px;gap:4px}
.minicalc .g div{border-radius:3px}
.minicalc .eq{grid-row:span 2}
.minicalc .zr{grid-column:span 2}

/* staging chips */
.slot{position:absolute;left:440px;top:30px;width:558px;height:108px;border:2px dashed #2c2c33;border-radius:14px;display:flex;align-items:center;justify-content:center;font:400 22px var(--sans);color:var(--dimmer)}
.chip{position:absolute;display:flex;align-items:center;gap:10px;font:600 24px/1 var(--mono);color:#fde68a;background:rgba(245,158,11,.14);border:2px solid rgba(245,158,11,.7);border-radius:12px;padding:12px 16px}
.chip em{font-style:normal;color:#f59e0b;font-size:20px;border:1.5px solid #f59e0b;border-radius:6px;padding:2px 6px}

/* graph */
.graph{position:absolute;left:430px;top:0;width:580px;height:172px}
.graph svg{position:absolute;inset:0}
.tag{position:absolute;font:600 18px/1 var(--mono);border-radius:8px;padding:7px 10px;white-space:nowrap}

/* flying token */
.fly{position:absolute;z-index:20;font:600 22px/1 var(--mono);border-radius:999px;padding:10px 18px;white-space:nowrap;opacity:0;color:#0b0b0e}

/* rail */
.rail{position:absolute;left:97px;top:0;width:2px;height:730px;background:repeating-linear-gradient(to bottom,#3a3a42 0 6px,transparent 6px 14px)}

/* step caption */
.stepl{position:absolute;top:1440px;left:0;right:0;text-align:center;font:700 26px/1 "Inter",sans-serif;letter-spacing:4px}
.cap{position:absolute;top:1484px;left:40px;right:40px;text-align:center;font:700 44px/1.3 var(--sans);color:#fafafa}
.sub{position:absolute;top:1550px;left:40px;right:40px;text-align:center;font:500 31px/1.35 var(--sans);color:#a1a1aa}
.dots{position:absolute;top:1616px;left:0;right:0;display:flex;justify-content:center;gap:12px}
.dots i{display:block;height:12px;border-radius:6px;background:#3f3f46;width:12px}
.foot{position:absolute;top:1668px;left:0;right:0;text-align:center;font:500 24px/1 var(--sans);color:#5f5f69}
</style>
</head>
<body>
<div class="brand">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></div>
  <span>github-tutorial.scholarverse.cc</span>
</div>
<div class="kicker">GitHub 實戰教學｜步驟 2</div>
<div class="title">Git 基本操作流程</div>

<div class="term">
  <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><b>calculator-app — zsh</b></div>
  <div class="body" id="tb"></div>
</div>

<div class="cards" id="cards">
  <div class="rail"></div>
</div>

<div class="stepl" id="stepl"></div>
<div class="cap" id="cap"></div>
<div class="sub" id="sub"></div>
<div class="dots" id="dots"></div>
<div class="foot">完整講義與指令 → github-tutorial.scholarverse.cc</div>

<script>
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const backOut=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{a=hex(a);b=hex(b);return `rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')})`};
const rgba=(h,a)=>`rgba(${hex(h).join(',')},${a})`;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

// ---------- stages ----------
const ST=[
  {key:'wd', zh:'工作目錄', en:'Working Directory', cmd:'編輯檔案', color:'#3b82f6',
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>'},
  {key:'st', zh:'暫存區', en:'Staging Area', cmd:'git add', color:'#f59e0b',
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v10H14l-2 3-2-3H4z"/><path d="M8 9h8M8 12h5" stroke-linecap="round"/></svg>'},
  {key:'lo', zh:'本機儲存庫', en:'Local Repository', cmd:'git commit', color:'#22c55e',
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="5" rx="1"/><rect x="4" y="10" width="16" height="5" rx="1"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg>'},
  {key:'re', zh:'遠端 GitHub', en:'Remote · origin', cmd:'git push', color:'#a78bfa',
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.5 4.3 4.3 0 0 0 7 18z"/></svg>'},
];
const CARD_H=172, GAP=14;
const cardTop=i=>i*(CARD_H+GAP);
const cards=document.getElementById('cards');
ST.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='card'; d.id='card-'+s.key; d.style.top=cardTop(i)+'px';
  d.innerHTML=`<div class="glow"></div><div class="ic" style="color:#71717a">${s.icon}</div>
    <div class="tx"><div class="zh">${s.zh}</div><div class="en">${s.en}</div><div class="cmd">${s.cmd}</div></div>`;
  cards.appendChild(d);
});
// WD content
document.getElementById('card-wd').insertAdjacentHTML('beforeend',`
  <div class="code"><div class="fh"><span>style.css</span><span class="badge" id="mbadge">M</span></div>
    <div class="row"><span style="color:#93c5fd">button</span><span style="left:84px;color:#d4d4d8">{</span></div>
    <div class="row" id="r-old"><span id="r-old-t"></span></div>
    <div class="row" id="r-new"><span id="r-new-t"></span></div>
  </div>
  <div class="minicalc"><div class="disp">0</div><div class="g" id="mg"></div></div>`);
{
  const g=document.getElementById('mg');
  const keys=['b','b','b','b','b','b','b','b','b','b','b','b','b','b','b','eq','zr','b'];
  keys.forEach(k=>{const e=document.createElement('div'); if(k!=='b') e.className=k; e.dataset.k=k; g.appendChild(e);});
}
// staging content
document.getElementById('card-st').insertAdjacentHTML('beforeend',
  `<div class="slot" id="slot">空的</div><div class="chip" id="stchip" style="left:460px;top:56px;opacity:0">style.css <em>M</em></div>`);
// graphs
for(const k of ['lo','re']){
  document.getElementById('card-'+k).insertAdjacentHTML('beforeend',
   `<div class="graph"><svg id="svg-${k}" width="580" height="172"></svg><div class="tag" id="tag-${k}"></div></div>`);
}

// ---------- timeline ----------
const PROMPT='$ ';
const tl=[]; let T=0;
const wait=s=>{T+=s};
const ev=(k,o={})=>tl.push({k,at:T,...o});
function typeCmd(cmd,cps=15){ ev('type',{cmd,cps}); T+=cmd.length/cps; T+=0.18; ev('enter'); T+=0.3; }
function out(lines,gap=0.06){ ev('out',{lines,gap}); T+=lines.length*gap+0.1; }
function cue(text){ ev('cue',{text}); }

const CAPS=[
  null,
  {cap:'修改 style.css，把按鈕改成藍色', sub:'git status：檔案已修改，還沒放進暫存區'},
  {cap:'git diff：看清楚改了哪幾行', sub:'<span style="color:#f87171">－ 舊的內容</span>　<span style="color:#4ade80">＋ 新的內容</span>'},
  {cap:'git add：把修改放進暫存區', sub:'暫存區 = 下一次 commit 要存的內容'},
  {cap:'git commit：存成一個快照 <span style="font-family:var(--mono);color:#4ade80">7434ffb</span>', sub:'git log 列出每一次 commit 的紀錄'},
  {cap:'git push：把 commit 送上 GitHub', sub:'四個地方一致 → working tree clean'},
];

// intro
ev('step',{n:0});
cue('這次我們把計算機的按鈕改成藍色，順便走一次完整的 Git 流程。');
wait(2.6);

// STEP 1 — edit
ev('step',{n:1}); ev('clear');
cue('先在 style.css 裡，把按鈕的背景色從灰色改成淺藍色。');
wait(0.5); ev('edit'); wait(3.0);
cue('輸入 git status，Git 說 style.css 已經被修改，但還沒放進暫存區。');
typeCmd('git status');
out([['On branch main','c-dim'],['Changes not staged for commit:',''],['        modified:   style.css','c-red']]);
wait(4.0);

// STEP 2 — diff
ev('step',{n:2}); ev('clear'); wait(0.3);
cue('輸入 git diff，可以看到改了哪幾行：減號是舊的內容，加號是新的內容。');
typeCmd('git diff style.css');
out([
 ['@@ -43,14 +43,14 @@ button {','c-cyan'],
 ['-    background: #f0f0f0;','c-red'],
 ['+    background: #e3f2fd;  /* 改為淺藍色 */','c-green'],
 ['@@ -58,13 +58,13 @@ button:active {','c-cyan'],
 ['-    background: #667eea;','c-red'],
 ['+    background: #2196f3;  /* 改為藍色 */','c-green'],
],0.09);
wait(5.2);

// STEP 3 — add
ev('step',{n:3}); ev('clear'); wait(0.3);
cue('確認沒問題後，用 git add 把這個修改放進暫存區。');
typeCmd('git add style.css');
ev('fly',{from:0,to:1,label:'style.css',dur:0.9}); wait(0.9); ev('land',{to:1});
wait(1.8);
cue('再看一次 git status，style.css 已經在「準備存檔」的清單裡了。');
typeCmd('git status');
out([['On branch main','c-dim'],['Changes to be committed:',''],['        modified:   style.css','c-green']]);
wait(3.6);

// STEP 4 — commit
ev('step',{n:4}); ev('clear'); wait(0.3);
cue('用 git commit 把暫存區存成一個快照，Git 給它一個編號：7434ffb。');
typeCmd('git commit -m "Update button colors to blue theme"',24);
ev('fly',{from:1,to:2,label:'7434ffb',dur:0.9});
out([['[main 7434ffb] Update button colors to blue theme',''],[' 1 file changed, 4 insertions(+), 4 deletions(-)','']]);
wait(0.75); ev('land',{to:2});
wait(2.4);
cue('git log --oneline 會列出每一次 commit，最新的在最上面。');
typeCmd('git log --oneline');
out([
 [['7434ffb ','c-yellow'],['(','c-yellow'],['HEAD -> ','c-hd'],['main','c-green'],[') ','c-yellow'],['Update button colors to blue theme','']],
 [['3108cfa ','c-yellow'],['(','c-yellow'],['origin/main','c-red'],[', ','c-yellow'],['origin/HEAD','c-red'],[') ','c-yellow'],['Initial calculator with basic operations','']],
 [['779adb0 ','c-yellow'],['Initial commit','']],
],0.08);
wait(4.4);

// STEP 5 — push
ev('step',{n:5}); ev('clear'); wait(0.3);
cue('最後用 git push，把這個 commit 送到 GitHub 上的遠端儲存庫。');
typeCmd('git push origin main');
ev('fly',{from:2,to:3,label:'7434ffb',dur:1.0});
wait(0.35);
out([['To https://github.com/Chihuah/calculator-app.git',''],['   3108cfa..7434ffb  main -> main','']]);
wait(0.45); ev('land',{to:3});
wait(2.2);
cue('git status 顯示 working tree clean，代表四個地方的內容都一致了。');
typeCmd('git status');
out([['On branch main','c-dim'],["Your branch is up to date with 'origin/main'.",''],['',''],['nothing to commit, working tree clean','c-green']]);
wait(0.5); ev('allok'); wait(3.4);
cue('修改、add、commit、push，就是每天最常用的 Git 流程。');
ev('outro'); wait(3.6);
const DURATION=T;
tl.sort((a,b)=>a.at-b.at);

// ---------- state at time t ----------
const BASE_HASHES=['779adb0','3108cfa'];
function stateAt(t){
  const s={step:0,stepAt:0,lines:[],typing:null,editAt:null,flies:[],
    land:{}, stagedAt:null, unstagedAt:null, wdCleanAt:null, localNewAt:null, remoteNewAt:null, allokAt:null, outroAt:null, active:{}, lastType:null};
  for(const e of tl){
    if(e.at>t) break;
    switch(e.k){
      case 'step': s.step=e.n; s.stepAt=e.at; break;
      case 'clear': s.lines=[]; break;
      case 'type': s.typing={cmd:e.cmd,at:e.at,cps:e.cps}; break;
      case 'enter': s.lines.push({prompt:true,text:s.typing.cmd}); s.typing=null; break;
      case 'out': {
        const n=Math.min(e.lines.length, Math.floor((t-e.at)/e.gap)+1);
        for(let i=0;i<n;i++) s.lines.push({seg:e.lines[i]});
        break; }
      case 'edit': s.editAt=e.at; break;
      case 'fly': if(t<e.at+e.dur) s.flies.push({...e,p:(t-e.at)/e.dur}); break;
      case 'land':
        s.land[e.to]=e.at;
        if(e.to===1){ s.stagedAt=e.at; s.wdCleanAt=e.at; }
        if(e.to===2){ s.unstagedAt=e.at; s.localNewAt=e.at; }
        if(e.to===3){ s.remoteNewAt=e.at; }
        break;
      case 'allok': s.allokAt=e.at; break;
      case 'outro': s.outroAt=e.at; break;
    }
  }
  return s;
}

// ---------- render ----------
const tb=document.getElementById('tb');
const STEP_COLOR=['#60a5fa','#3b82f6','#3b82f6','#f59e0b','#22c55e','#a78bfa'];
const STEP_STAGE=[null,0,0,1,2,3];
const dots=document.getElementById('dots');
for(let i=1;i<=5;i++){const d=document.createElement('i');dots.appendChild(d);}

function segHTML(seg){
  if(typeof seg[0]==='string') return `<span class="${seg[1]}">${esc(seg[0])}</span>`;
  return seg.map(p=>`<span class="${p[1]}">${esc(p[0])}</span>`).join('');
}

function render(t){
  const s=stateAt(t);

  // terminal
  let html='';
  const rows=[];
  for(const l of s.lines){
    if(l.prompt) rows.push(`<span class="ps">${PROMPT}</span>${esc(l.text)}`);
    else rows.push(segHTML(l.seg));
  }
  const blink=(Math.floor(t*2)%2===0);
  if(s.typing){
    const n=Math.min(s.typing.cmd.length,Math.floor((t-s.typing.at)*s.typing.cps));
    rows.push(`<span class="ps">${PROMPT}</span>${esc(s.typing.cmd.slice(0,n))}<span class="cur"></span>`);
  } else {
    rows.push(`<span class="ps">${PROMPT}</span><span class="cur" style="opacity:${blink?1:0}"></span>`);
  }
  const MAXR=10;
  tb.innerHTML=rows.slice(-MAXR).map(r=>`<div class="ln">${r}</div>`).join('');

  // active stage highlight
  const actIdx=STEP_STAGE[s.step];
  ST.forEach((st,i)=>{
    const card=document.getElementById('card-'+st.key);
    let a=0;
    if(actIdx===i) a=easeOut((t-s.stepAt)/0.35);
    // when a fly lands somewhere else in this step, keep the active one but also flash target
    if(s.land[i]!==undefined && t-s.land[i]<1.2 && actIdx!==i) a=Math.max(a,1-(t-s.land[i])/1.2);
    if(s.allokAt!==null) a=Math.max(a, easeOut((t-s.allokAt-i*0.15)/0.4));
    // landing pulse
    let pulse=0; if(s.land[i]!==undefined){const d=t-s.land[i]; if(d>=0&&d<0.6) pulse=Math.sin(d/0.6*Math.PI);}
    card.style.borderColor=a>0.01?rgba(st.color,0.25+0.65*a):'#26262c';
    card.style.boxShadow=a>0.01?`0 0 ${30+30*pulse}px ${rgba(st.color,0.25*a+0.25*pulse)}, inset 0 0 0 1px ${rgba(st.color,0.2*a)}`:'none';
    card.style.transform=`scale(${1+0.015*pulse})`;
    const glow=card.querySelector('.glow');
    glow.style.background=`linear-gradient(100deg, ${rgba(st.color,0.16)} 0%, ${rgba(st.color,0.03)} 55%, transparent 100%)`;
    glow.style.opacity=a;
    const ic=card.querySelector('.ic');
    ic.style.color=a>0.01?mix('#71717a',st.color,a):'#71717a';
    ic.style.borderColor=a>0.01?rgba(st.color,0.3+0.5*a):'#2c2c33';
    ic.style.background=a>0.01?rgba(st.color,0.08+0.1*a):'#1a1a1f';
    card.querySelector('.zh').style.color=mix('#a1a1aa','#fafafa',Math.max(a,0.0));
    const cmd=card.querySelector('.cmd');
    cmd.style.color=a>0.01?mix('#a1a1aa',st.color,a):'#a1a1aa';
    cmd.style.borderColor=a>0.01?rgba(st.color,0.25+0.4*a):'#2c2c33';
  });

  // WD code edit
  const ep=s.editAt===null?0:clamp((t-s.editAt)/1.2);
  const oldT=document.getElementById('r-old-t'), newT=document.getElementById('r-new-t');
  if(ep<=0){
    oldT.innerHTML='<span style="color:#d4d4d8">  background: </span><span style="color:#d4d4d8">#f0f0f0;</span>';
    newT.innerHTML='<span style="color:#d4d4d8">}</span>';
  } else {
    const strike=clamp(ep/0.3);
    oldT.innerHTML=`<span style="color:${mix('#d4d4d8','#f87171',strike)};text-decoration:${strike>0.5?'line-through':'none'}">- background: #f0f0f0;</span>`;
    const full='+ background: #e3f2fd;';
    const n=Math.floor(clamp((ep-0.3)/0.6)*full.length);
    newT.innerHTML=`<span style="color:#4ade80">${esc(full.slice(0,n))}</span>`;
  }
  // code row highlight during diff step
  const diffHL = s.step===2 ? 0.5+0.5*Math.sin((t-s.stepAt)*4) : 0;
  document.getElementById('r-old').style.background=s.step===2?`rgba(248,113,113,${0.10+0.12*diffHL})`:'transparent';
  document.getElementById('r-new').style.background=s.step===2?`rgba(74,222,128,${0.10+0.12*diffHL})`:'transparent';
  // M badge: visible after edit until staged
  const mb=document.getElementById('mbadge');
  let mOp = ep>0.2?1:0;
  if(s.wdCleanAt!==null) mOp=1-clamp((t-s.wdCleanAt)/0.4);
  mb.style.opacity=mOp;
  // mini calc colors
  const cp=s.editAt===null?0:clamp((t-s.editAt-0.6)/0.8);
  document.querySelectorAll('#mg div').forEach(d=>{
    if(d.dataset.k==='eq') d.style.background=mix('#667eea','#2196f3',cp);
    else d.style.background=mix('#d9d9d9','#bfdcfb',cp);
  });

  // staging chip
  const chip=document.getElementById('stchip'), slot=document.getElementById('slot');
  let chipOp=0, chipY=0, chipS=1;
  if(s.stagedAt!==null){ const q=(t-s.stagedAt)/0.35; chipOp=clamp(q); chipS=lerp(0.8,1,backOut(q)); }
  if(s.unstagedAt!==null){ const q=clamp((t-s.unstagedAt+0.75)/0.5); chipOp=Math.min(chipOp,1-q); }
  // chip hides at commit enter (fly starts ~0.75 before land)
  chip.style.opacity=chipOp; chip.style.transform=`translateY(${chipY}px) scale(${chipS})`;
  slot.style.opacity=1-chipOp;

  // graphs
  drawGraph('lo', s.localNewAt, t, '#22c55e', 'HEAD → main', s.step);
  drawGraph('re', s.remoteNewAt, t, '#a78bfa', 'origin/main', s.step);

  // flying tokens
  document.querySelectorAll('.fly').forEach(e=>e.remove());
  for(const f of s.flies){
    const el=document.createElement('div'); el.className='fly';
    const col=ST[f.to].color;
    el.textContent=f.label;
    el.style.background=col;
    el.style.boxShadow=`0 0 30px ${rgba(col,0.7)}`;
    const y0=cardTop(f.from)+CARD_H/2, y1=cardTop(f.to)+CARD_H/2;
    const p=ease(f.p);
    const y=lerp(y0,y1,p);
    const op=clamp(f.p/0.12)*clamp((1-f.p)/0.12);
    el.style.opacity=op;
    el.style.left='70px';
    el.style.top=(y-22)+'px';
    el.style.transform=`scale(${0.9+0.15*Math.sin(p*Math.PI)})`;
    cards.appendChild(el);
  }

  // caption
  const stepl=document.getElementById('stepl'), cap=document.getElementById('cap'), sub=document.getElementById('sub');
  const capFade=easeOut((t-s.stepAt)/0.4);
  let c, label='';
  if(s.outroAt!==null){
    c={cap:'修改 → add → commit → push', sub:'每天最常用的 Git 流程，就是這 4 步'};
    label='DONE'; stepl.style.color='#4ade80';
  } else if(s.step===0){
    c={cap:'把計算機的按鈕改成藍色', sub:'跟著走一次完整的 Git 流程'}; label='calculator-app';
    stepl.style.color='#60a5fa';
  } else { c=CAPS[s.step]; label=`STEP ${s.step} / 5`; stepl.style.color=STEP_COLOR[s.step]; }
  const fadeT = s.outroAt!==null ? easeOut((t-s.outroAt)/0.4) : capFade;
  stepl.textContent=label;
  cap.innerHTML=c.cap; sub.innerHTML=c.sub;
  for(const el of [stepl,cap,sub]){ el.style.opacity=fadeT; el.style.transform=`translateY(${(1-fadeT)*14}px)`; }
  [...dots.children].forEach((d,i)=>{
    const on=(i+1)===s.step && s.outroAt===null;
    const done=(i+1)<s.step || s.outroAt!==null;
    d.style.width=on?'44px':'12px';
    d.style.background=on?STEP_COLOR[s.step]:(done?rgba(STEP_COLOR[i+1],0.55):'#3f3f46');
  });
}

function drawGraph(k,newAt,t,color,label,step){
  const svg=document.getElementById('svg-'+k), tag=document.getElementById('tag-'+k);
  const xs=[40,170,300], cy=72;
  const p=newAt===null?0:clamp((t-newAt)/0.5);
  const sc=newAt===null?0:backOut((t-newAt)/0.45);
  let g='';
  // edges
  g+=`<line x1="${xs[0]}" y1="${cy}" x2="${xs[1]}" y2="${cy}" stroke="#52525b" stroke-width="4"/>`;
  if(p>0) g+=`<line x1="${xs[1]}" y1="${cy}" x2="${lerp(xs[1],xs[2],easeOut(p))}" y2="${cy}" stroke="${color}" stroke-width="4"/>`;
  const hashes=[...BASE_HASHES,'7434ffb'];
  for(let i=0;i<3;i++){
    if(i===2 && p<=0) continue;
    const isNew=i===2, isHead=(newAt===null?i===1:i===2);
    const r=isNew?16*sc:14;
    const fill=isHead?color:'#0c0c0f';
    const stroke=isHead?color:'#71717a';
    if(isNew && sc>0) g+=`<circle cx="${xs[i]}" cy="${cy}" r="${r+10*(1-clamp((t-newAt)/0.8))}" fill="none" stroke="${color}" stroke-opacity="${0.6*(1-clamp((t-newAt)/0.8))}" stroke-width="3"/>`;
    g+=`<circle cx="${xs[i]}" cy="${cy}" r="${Math.max(0,r)}" fill="${fill}" stroke="${stroke}" stroke-width="4"/>`;
    g+=`<text x="${xs[i]}" y="${cy+46}" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19" fill="${isNew?color:'#8b8b94'}" opacity="${isNew?clamp(p*2):1}" font-weight="${isNew?600:400}">${hashes[i]}</text>`;
  }
  svg.innerHTML=g;
  // tag position slides from node 1 to node 2
  const tx=lerp(xs[1],xs[2],ease(p))+30;
  tag.textContent=label;
  tag.style.left=tx+'px'; tag.style.top=(cy-17)+'px';
  tag.style.color=color; tag.style.background=rgba(color,0.12); tag.style.border=`1.5px solid ${rgba(color,0.6)}`;
}

// ---------- exports for the recorder ----------
window.DURATION=DURATION;
window.render=render;
window.TIMELINE=tl;
window.soundEvents=function(){
  const evs=[];
  for(const e of tl){
    if(e.k==='fly') evs.push({t:e.at,k:'whoosh',dur:e.dur});
    if(e.k==='land') evs.push({t:e.at,k:'land',to:e.to});
    if(e.k==='step' && e.n>0) evs.push({t:e.at,k:'step'});
    if(e.k==='allok') evs.push({t:e.at,k:'chime'});
  }
  return evs;
};
window.cues=function(){
  const c=tl.filter(e=>e.k==='cue');
  return c.map((e,i)=>({start:e.at,end:i+1<c.length?c[i+1].at:DURATION,text:e.text}));
};
render(0);
</script>
