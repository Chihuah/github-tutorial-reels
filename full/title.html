<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>GitHub 實戰教學完整版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="../lib/reel.css">
<style>
.title{top:250px;font-size:84px}
.kicker{top:200px}
.lead{position:absolute;top:370px;left:0;right:0;text-align:center;font:500 34px/1.4 var(--sans);color:#a1a1aa}
.toc{position:absolute;top:500px;left:90px;right:90px}
.toc .it{display:flex;align-items:center;gap:26px;height:118px;border-bottom:1px solid #222228;opacity:0}
.toc .n{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;font:800 34px/1 "Inter",sans-serif;color:#0b0b0e}
.toc .t{font:700 40px/1.2 var(--sans);color:#fafafa}
.toc .s{font:500 25px/1.3 var(--mono);color:#8b8b94;margin-top:6px}
</style>
</head>
<body>
<div class="brand">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></div>
  <span>github-tutorial.scholarverse.cc</span>
</div>
<div class="kicker">完整版｜8 個步驟</div>
<div class="title">GitHub 實戰教學</div>
<div class="lead">用一個計算機專案，從建立 repository 到發布 v2.0</div>
<div class="toc" id="toc"></div>
<script>
// Chapter list shown on the opening card; tools/build-full.sh uses the same titles for chapters.
const CHAPTERS = [
  ['建立專案並首次部署', 'clone · add · commit · push · Pages', '#a78bfa'],
  ['Git 基本操作流程', 'status · diff · add · commit · push', '#3b82f6'],
  ['分支與 Pull Request', 'checkout -b · push · PR · merge · pull', '#22c55e'],
  ['版本倒退', 'revert · reset --hard · push -f', '#ef4444'],
  ['用分支開發記憶功能', 'branch · 分階段 commit · log main..', '#f59e0b'],
  ['完整測試後用 PR 合併', 'http.server · PR #3 · branch -d', '#3b82f6'],
  ['A/B 測試：兩種設計', '兩個分支 · git diff · checkout', '#2dd4bf'],
  ['選出最佳方案並發布', 'merge · branch -D · tag v2.0', '#facc15'],
];
document.getElementById('toc').innerHTML = CHAPTERS.map((c, i) =>
  `<div class="it" id="it${i}"><div class="n" style="background:${c[2]}">${i + 1}</div><div><div class="t">${c[0]}</div><div class="s">${c[1]}</div></div></div>`).join('');

const DURATION = 5.0;
const clamp = x => Math.max(0, Math.min(1, x));
window.DURATION = DURATION;
window.render = t => {
  CHAPTERS.forEach((_, i) => {
    const p = clamp((t - 0.4 - i * 0.18) / 0.4), e = 1 - Math.pow(1 - p, 3);
    const el = document.getElementById('it' + i);
    el.style.opacity = e; el.style.transform = `translateX(${(1 - e) * 40}px)`;
  });
};
window.soundEvents = () => [];
window.cues = () => [{ start: 0, end: DURATION, text: 'GitHub 實戰教學完整版：用一個計算機專案，走完從建立專案到發布 v2.0 的 8 個步驟。' }];
window.CHAPTERS = CHAPTERS;
render(0);
</script>
</body>
</html>
